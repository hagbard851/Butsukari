// Resolve the exercise list for a session at start time.
// Returns exercise clones with tier-adjusted set counts already applied.
function getTierList(wid, tier, sessions) {
  let ids;
  if (wid === "T" || wid === "P") {
    ids = WORKOUTS[wid].exercises.map(e => e.id);
  } else {
    ids = [...(TIERS[tier] && TIERS[tier][wid] ? TIERS[tier][wid] : TIERS['9'][wid])];
    // Season-7 Day A rotating finisher.
    // Only tier-7 sessions participate: 9/11 days always include farmer, so
    // consulting them would bias the rotation. No tier-7 history → farmer first.
    if (wid === "A" && tier === '7') {
      const last7A = [...sessions].filter(s => s.wid === "A" && s.tier === '7' && s.entries).sort((x, y) => new Date(y.date) - new Date(x.date))[0];
      const didFarmer = last7A && last7A.entries['farmer'] && last7A.entries['farmer'].done;
      ids = ids.concat(didFarmer ? ["hang", "plank-a"] : ["farmer"]);
    }
    // Pull-up graduation: assist reached 0 → bodyweight reps
    if (CFG.pullupsBW) ids = ids.map(id => id === "pullups" ? "pull-bw" : id);
    // Hammer curl corrective — every A/B day, outside the count
    ids.push(wid === "A" ? "hammer-curl" : "hammer-curl-b");
  }
  const setsOv = TIER_SETS[tier] || {};
  return ids.map(id => EX_BY_ID[id]).filter(Boolean).map(e => ({ ...e, sets: setsOv[e.id] || e.sets }));
}

// ─── DURABLE STORAGE ──────────────────────────────────────────────────────────
// IndexedDB is the primary store (survives storage pressure once persisted);
// localStorage stays as a write-through mirror and one-time migration source.
const IDB = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise(res => {
      try {
        const rq = indexedDB.open("lobo-gym-db", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
      } catch {
        res(null);
      }
    });
    return this._p;
  },
  async get(k) {
    const db = await this.open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const rq = db.transaction("kv").objectStore("kv").get(k);
        rq.onsuccess = () => res(rq.result === undefined ? null : rq.result);
        rq.onerror = () => res(null);
      } catch {
        res(null);
      }
    });
  },
  async set(k, v) {
    const db = await this.open();
    if (!db) return;
    try {
      db.transaction("kv", "readwrite").objectStore("kv").put(v, k);
    } catch {}
  },
  async del(k) {
    const db = await this.open();
    if (!db) return;
    try {
      db.transaction("kv", "readwrite").objectStore("kv").delete(k);
    } catch {}
  }
};
const DB = {
  async get(k) {
    const v = await IDB.get(k);

  set(k, v) {
    LS.set(k, v);
    IDB.set(k, v);
  },
  del(k) {
    LS.del(k);

  }
};

function getHistory(sessions, id, altId = null, field = "weight") {
  const result = [];
  for (const s of sessions) {
    const e = s.entries?.[id] ?? (altId ? s.entries?.[altId] : null);
    const setsCompleted = Number(e?.sets) || 0;

    // Prefilled-but-untouched exercises are not attempts.
    if (!e || setsCompleted <= 0) continue;

    let weight = e[field] != null && e[field] !== "" ? Number(e[field]) : null;
    let setLoads = null;
    let mixedLoad = false;

    // v15.2+: each completed set captures the load actually used.
    // The final performed set becomes the anchor for the next session.
    if (field === "weight" && Array.isArray(e.setLoads) && e.setLoads.length) {
      setLoads = e.setLoads
        .slice(0, setsCompleted)
        .map(Number)
        .filter(Number.isFinite);
      if (setLoads.length) {
        weight = setLoads[setLoads.length - 1];
        mixedLoad = setLoads.some(w => w !== weight);
      }
    }

    if (!Number.isFinite(weight)) continue;
    result.push({
      date: s.endDate || s.date,
      weight,
      setsCompleted,
      reqSets: e.req || null,
      setLoads,
      mixedLoad,
      tier: s.tier != null ? String(s.tier) : null
    });
  }
  return result.sort((a, b) => new Date(a.date) - new Date(b.date));
}
function getLastW(sessions, id, altId = null, field = "weight") {
  const h = getHistory(sessions, id, altId, field);
  return h.length > 0 ? h[h.length - 1].weight : null;
}

function reducedWorkingLoad(current, factor, prog) {
  const step = Number(prog?.inc) > 0 ? Number(prog.inc) : 2.5;
  if (prog?.down) {
    // Assistance exercises deload by ADDING assistance.
    const rounded = roundTo(current / factor, step);
    return Math.max(current + step, rounded);
  }
  const rounded = roundTo(current * factor, step);
  return Math.max(0, Math.min(current - step, rounded));
}

// ─── PROGRESSION ──────────────────────────────────────────────────────────────
// Core progression logic shared by whole exercises and Row parts.
// "Completed" means: sets done >= the sets that were REQUIRED that session
// (stored per-entry as `req` since tiers can lower set counts), falling back
// to the exercise's default when req is absent (pre-v14 history).
function smartCore(history, prog, ex, defaultSets, startW, currentTier = null) {
  const unitW = ex.trackTime ? "sec" : ex.trackReps ? "reps" : "lbs";
  const tier = String(currentTier || seasonAt().tier || "9");
  const policy = progressionPolicy(tier);
  const doneOf = h => h.setsCompleted >= (h.reqSets || defaultSets);
  const cleanDoneOf = h => doneOf(h) && !h.mixedLoad;

  if (history.length === 0) return {
    currentWeight: startW,
    nextWeight: null,
    status: 'initial',
    label: 'START',
    color: '#88847F',
    policy: policy.name,
    tip: 'First session — establish a clean working load.'
  };

  const last = history[history.length - 1];
  const cw = last.weight;
  const daysSince = Math.max(0, (Date.now() - new Date(last.date).getTime()) / 86400000);

  // Any in-session load change becomes the new anchor. It is never treated as
  // a clean progression exposure at either the old or new load.
  if (last.mixedLoad) return {
    currentWeight: cw,
    nextWeight: null,
    status: 'reset',
    label: 'RESET',
    color: '#E8952A',
    policy: policy.name,
    tip: `Load changed during the last session. Re-establish ${cw} ${ex.unit || unitW} cleanly before KITAE advances it.`
  };

  // Long and very-long gaps produce an actual return load, not merely a note.
  // Assistance exercises invert the arithmetic: more assistance = easier.
  if (daysSince > policy.moderateGapDays) {
    const veryLong = daysSince >= policy.veryLongGapDays;
    const factor = veryLong ? policy.veryLongReturnFactor : policy.returnFactor;
    const rw = reducedWorkingLoad(cw, factor, prog);
    return {
      currentWeight: cw,
      nextWeight: rw,
      status: 'return-down',
      label: veryLong ? 'LONG RETURN' : 'RETURN',
      color: '#E8952A',
      policy: policy.name,
      gapDays: Math.floor(daysSince),
      tip: `${Math.floor(daysSince)} days since this exercise. ${policy.name}: restart at ${rw} ${ex.unit || unitW}; the old progression streak is retired.`
    };
  }

  // Missing roughly one exposure is not a failure. Repeat the last real load
  // once, then rebuild progression evidence from there.
  if (daysSince > policy.shortGapDays) return {
    currentWeight: cw,
    nextWeight: null,
    status: 'repeat',
    label: 'REPEAT',
    color: '#E8952A',
    policy: policy.name,
    gapDays: Math.floor(daysSince),
    tip: `${Math.floor(daysSince)} days since this exercise. Repeat ${cw} ${ex.unit || unitW}; no increase is earned across the gap.`
  };

  // Changing tier changes the training objective. Keep the load anchor but do
  // not carry progression credit from build season into maintenance or vice versa.
  if (last.tier && last.tier !== tier) return {
    currentWeight: cw,
    nextWeight: null,
    status: 'tier-shift',
    label: 'TIER SHIFT',
    color: '#5AA0E0',
    policy: policy.name,
    tip: `Now using ${policy.name}. Repeat ${cw} ${ex.unit || unitW} once in Tier ${tier} before this tier starts making progression decisions.`
  };

  const nw = prog.down ? Math.max(0, cw - prog.inc) : cw + prog.inc;

  // Only evidence from the same tier and without a meaningful exposure gap can
  // form a streak or stall. Old seasons and interrupted blocks cannot combine.
  const contiguous = [last];
  for (let i = history.length - 2; i >= 0; i--) {
    const older = history[i];
    const newer = contiguous[0];
    const gapDays = (new Date(newer.date).getTime() - new Date(older.date).getTime()) / 86400000;
    if (gapDays > policy.shortGapDays) break;
    if ((newer.tier || null) !== (older.tier || null)) break;
    if (older.tier && older.tier !== tier) break;
    contiguous.unshift(older);
  }

  let cleanStreak = 0;
  for (let i = contiguous.length - 1; i >= 0; i--) {
    const h = contiguous[i];
    if (h.weight === cw && cleanDoneOf(h)) cleanStreak++;
    else break;
  }

  let failStreak = 0;
  for (let i = contiguous.length - 1; i >= 0; i--) {
    const h = contiguous[i];
    if (h.weight === cw && !doneOf(h) && !h.mixedLoad) failStreak++;
    else break;
  }

  if (failStreak >= policy.stallDeload) {
    const dw = reducedWorkingLoad(cw, policy.deloadFactor, prog);
    return {
      currentWeight: cw,
      nextWeight: dw,
      status: 'deload',
      label: 'DELOAD',
      color: '#E05858',
      policy: policy.name,
      failStreak,
      tip: `${failStreak} genuine incomplete attempts at ${cw} ${ex.unit || unitW}. ${policy.name}: reset to ${dw}, then rebuild from clean completions.`
    };
  }

  if (failStreak >= policy.stallWarn) return {
    currentWeight: cw,
    nextWeight: null,
    status: 'stall',
    label: 'STALL',
    color: '#E8952A',
    policy: policy.name,
    failStreak,
    tip: `${failStreak} incomplete attempts at the same load. Hold ${cw} ${ex.unit || unitW} once more; KITAE will deload only if the stall persists.`
  };

  if (cleanDoneOf(last) && cleanStreak >= policy.cleanRequired) return {
    currentWeight: cw,
    nextWeight: nw,
    status: 'ready',
    label: prog.down ? 'READY ↓' : 'READY ↑',
    color: '#4EC97A',
    policy: policy.name,
    streak: cleanStreak,
    tip: `${cleanStreak} clean completion${cleanStreak === 1 ? "" : "s"} at ${cw}. ${policy.name} requires ${policy.cleanRequired}; next is ${nw} ${ex.unit || unitW}.`
  };

  if (cleanDoneOf(last)) {
    const remaining = Math.max(0, policy.cleanRequired - cleanStreak);
    return {
      currentWeight: cw,
      nextWeight: nw,
      status: 'building',
      label: `${cleanStreak} OF ${policy.cleanRequired}`,
      color: '#E8952A',
      policy: policy.name,
      streak: cleanStreak,
      tip: `${policy.name}: ${remaining} more clean completion${remaining === 1 ? "" : "s"} at ${cw} ${ex.unit || unitW} before progressing to ${nw}.`
    };
  }

  return {
    currentWeight: cw,
    nextWeight: null,
    status: 'hold',
    label: 'HOLD',
    color: '#88847F',
    policy: policy.name,
    tip: `${last.setsCompleted}/${last.reqSets || defaultSets} prescribed sets completed. Hold the working load until the prescription is clean.`
  };
}

function getSmartNext(sessions, ex, currentTier = null) {
  if (ex.bw || ex.w === null || ex.parts) return null;
  const prog = PROG[ex.id];
  if (!prog) return null;
  const history = getHistory(sessions, ex.id, ex.alt);
  return smartCore(history, prog, ex, ex.sets, ex.w, currentTier);
}

// Row-style parts use the same adaptive engine and tier policy.
function getSmartNextPart(sessions, ex, part, currentTier = null) {
  const history = getHistory(sessions, ex.id, part.alt, part.field);
  return smartCore(history, { inc: part.inc, down: !!part.down }, ex, ex.sets, part.w, currentTier);
}
function getStats(sessions, id, target = null, down = false, altId = null) {
  const hist = getHistory(sessions, id, altId);
  if (hist.length === 0) return null;
  const current = hist[hist.length - 1].weight;
  const pr = down ? Math.min(...hist.map(h => h.weight)) : Math.max(...hist.map(h => h.weight));
  const isPR = current === pr;
  if (hist.length < 2) return {
    current,
    pr,
    isPR,
    ratePerWeek: null
  };
  const sample = hist.slice(-8);
  const n = sample.length;
  const t0 = new Date(sample[0].date).getTime();
  const xs = sample.map(h => (new Date(h.date).getTime() - t0) / (86400000 * 7));
  const ys = sample.map(h => h.weight);
  const sx = xs.reduce((a, b) => a + b, 0),
    sy = ys.reduce((a, b) => a + b, 0);
  const sxx = xs.reduce((a, b) => a + b * b, 0),
    sxy = xs.reduce((a, v, i) => a + v * ys[i], 0);
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1);
  let projection = null;
  if (target != null && slope !== 0) {
    const weeksToSep = (cfgDeadline() - new Date()) / (86400000 * 7);
    if (weeksToSep <= 0) {
      // Season boundary has passed — no pace math, just flag the cycle as ended.
      return { current, pr, isPR, ratePerWeek: Math.round(slope * 10) / 10, projection: { expired: true } };
    }
    const remaining = down ? current - target : target - current;
    const effectiveSlope = down ? -slope : slope;
    if (effectiveSlope > 0) {
      const weeksNeeded = remaining / effectiveSlope;
      projection = {
